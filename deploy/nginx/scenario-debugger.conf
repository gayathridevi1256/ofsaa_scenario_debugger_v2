# ==============================================================================
# scenario-debugger.conf — Nginx configuration for Scenario Debugger
#
# WHAT THIS FILE DOES:
#   1. Forces all HTTP traffic to HTTPS (secure)
#   2. Serves the React frontend (built static files)
#   3. Forwards all /api/ and /ws/ requests to FastAPI backend
#   4. Sets security headers required for bank environments
#   5. Rate limits the login endpoint to prevent brute force
#
# WHERE THIS FILE GOES:
#   /etc/nginx/sites-available/scenario-debugger.conf
#
# HOW TO ENABLE:
#   sudo ln -s /etc/nginx/sites-available/scenario-debugger.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t        (test config — must say "ok")
#   sudo systemctl reload nginx
#
# LAYMAN'S EXPLANATION:
#   Nginx sits in front of everything like a security guard at a bank entrance.
#   - Every visitor must use HTTPS (encrypted) — no plain HTTP allowed
#   - The guard knows: "if you're asking for /api/... go to FastAPI"
#   - Everything else (/, /login, /jobs/...) gets the React app
#   - The guard also checks IDs (rate limiting on login)
#   - And stamps every response with security seals (security headers)
# ==============================================================================

# ------------------------------------------------------------------------------
# RATE LIMITING ZONE
# Limits login attempts to 5 per minute per IP address.
# Prevents brute force password attacks.
# LAYMAN: If someone tries to guess passwords, they get blocked after 5 tries/min.
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ------------------------------------------------------------------------------
# HTTP → HTTPS REDIRECT
# Any request on port 80 (plain HTTP) is immediately redirected to HTTPS.
# LAYMAN: Like a sign at the front door saying "use the secure entrance".
# ------------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name scenario-debugger.yourbank.com;   # ← change to your domain/IP

    # Redirect all HTTP to HTTPS permanently
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# MAIN HTTPS SERVER
# ------------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name scenario-debugger.yourbank.com;   # ← change to your domain/IP

    # --------------------------------------------------------------------------
    # SSL CERTIFICATE
    # For internal bank use, use your bank's CA-signed certificate.
    # For self-signed (testing only):
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/scenario-debugger.key \
    #     -out /etc/ssl/certs/scenario-debugger.crt
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/scenario-debugger.crt;
    ssl_certificate_key /etc/ssl/private/scenario-debugger.key;

    # Modern SSL settings — disables old insecure protocols
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS
    # These tell the browser how to behave securely.
    # LAYMAN: Like instructions on the back of a visitor badge.
    # --------------------------------------------------------------------------

    # Prevent the page from being embedded in iframes (clickjacking protection)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent browser from guessing file types (MIME sniffing protection)
    add_header X-Content-Type-Options "nosniff" always;

    # Force HTTPS for all future visits (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Control what information is shared when clicking links
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — controls what the page can load
    # Allows: self, WebSocket connections, inline styles (needed for React)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:;" always;

    # Remove nginx version from error pages (don't advertise what software you run)
    server_tokens off;

    # --------------------------------------------------------------------------
    # LOGGING
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/scenario-debugger-access.log;
    error_log  /var/log/nginx/scenario-debugger-error.log;

    # --------------------------------------------------------------------------
    # REACT FRONTEND
    # Serves the built React static files.
    # "try_files" makes React Router work — any URL not found as a file
    # falls back to index.html so React handles the routing.
    # LAYMAN: If someone visits /jobs/abc123, Nginx can't find that file,
    # so it serves index.html and React shows the right page.
    # --------------------------------------------------------------------------
    root  /opt/scenario-debugger/frontend/dist;   # ← path to React build output
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (they have hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
        }
    }

    # --------------------------------------------------------------------------
    # RATE LIMIT — LOGIN ENDPOINT
    # Only 5 login attempts per minute per IP.
    # Returns 429 (Too Many Requests) if exceeded.
    # --------------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # FASTAPI BACKEND — all /api/ routes
    # Forwards to FastAPI running on localhost:8000
    # LAYMAN: Any URL starting with /api/ gets forwarded to the Python backend.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — pipeline can run for several minutes
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Upload size limit — match MAX_UPLOAD_MB in .env
        client_max_body_size 50M;
    }

    # --------------------------------------------------------------------------
    # WEBSOCKET — live pipeline progress
    # WebSocket needs special headers to upgrade the connection.
    # LAYMAN: A WebSocket is a "live phone call" between browser and server.
    # Normal HTTP is "send a letter, wait for reply".
    # These headers tell Nginx to set up the phone call properly.
    # --------------------------------------------------------------------------
    location /api/ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # These two headers are REQUIRED for WebSocket to work
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket connections stay open — increase timeout
        proxy_read_timeout 3600s;   # 1 hour
    }

    # --------------------------------------------------------------------------
    # BLOCK COMMON ATTACK PATHS
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;   # Block access to hidden files (.env, .git etc.)
    }

    location ~ \.(py|pyc|env|sh|sql)$ {
        deny all;   # Block direct access to source files
    }
}
